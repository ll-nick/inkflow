site_name: Inkflow
site_description: Beautiful slides from SVG. Your editor, your style.
site_url: https://ll-nick.github.io/inkflow
repo_url: https://github.com/ll-nick/inkflow
repo_name: ll-nick/inkflow

theme:
  name: material
  logo: assets/logo-light-icon.svg
  favicon: assets/logo-light-icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      custom_templates: docs/theme_overrides
      handlers:
        python:
          paths: [src]
          options:
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            separate_signature: true
            show_signature_annotations: true
            inherited_members: false
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - mkdocs-click
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Demo: demo/index.html
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Guides:
    - Authoring slides: guides/slides.md
    - Layout system: guides/layout-system.md
    - Transitions: guides/transitions.md
    - Themes: guides/themes.md
    - Fonts: guides/fonts.md
    - Export: guides/export.md
    - Presenter view: guides/presenter-view.md
  - Reference:
    - Manifest: reference/manifest.md
    - Themes: reference/theme.md
    - Enums: reference/enums.md
    - Animations: reference/animations.md
    - Transitions: reference/transitions.md
    - CLI: reference/cli.md
    - Built-in theme: built-in-theme/index.md
