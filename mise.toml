[tools]
uv   = "latest"
node = "lts"

[tasks.lint-py]
run = "uv run ruff check"

[tasks.fmt-py]
run = "uv run ruff format --check"

[tasks.typecheck-py]
run = "uv run basedpyright"

[tasks.test]
run = "uv run pytest"

[tasks.lint-js]
run = "npx biome check ."

[tasks.typecheck-js]
run = "npx tsc --noEmit"

[tasks.bundle]
run = [
  "npx esbuild src/ts/presenter/main.ts --bundle --outfile=src/inkflow/bundles/presenter.js",
  "npx esbuild src/css/presenter/index.css --bundle --outfile=src/inkflow/bundles/presenter.css",
]

[tasks.docs]
env = { NO_MKDOCS_2_WARNING = "1" }
run = ["uv run inkflow build --deck demo/deck.py --output docs/demo/presentation", "uv run mkdocs serve"]

[tasks.docs-build]
env = { NO_MKDOCS_2_WARNING = "1" }
run = ["uv run inkflow build --deck demo/deck.py --output docs/demo/presentation", "uv run mkdocs build"]

[tasks.test-js]
run = "npx vitest run"

[tasks.fix-py]
run = ["uv run ruff check --fix", "uv run ruff format"]

[tasks.fix-js]
run = "npx biome check --write ."

[tasks.fix]
run = ["uv run ruff check --fix", "uv run ruff format", "npx biome check --write ."]

[tasks.check]
depends = ["lint-py", "fmt-py", "typecheck-py", "test", "lint-js", "typecheck-js", "test-js"]
