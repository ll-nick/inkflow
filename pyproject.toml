[project]
name = "inkflow"
version = "0.1.0.dev0"
description = "Beautiful slides from SVG. Your editor, your style."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Nick Le Large"}]
requires-python = ">=3.11"
keywords = ["presentation", "slides", "svg", "inkscape", "animation"]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
dependencies = [
    "brotli>=1.2.0",
    "click>=8.0",
    "fonttools>=4.63.0",
    "latex2mathml>=3.81.0",
    "lxml>=5.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.6.1",
    "rich>=15.0.0",
    "watchfiles>=0.21",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://ll-nick.github.io/inkflow"
Repository = "https://github.com/ll-nick/inkflow"

[project.scripts]
inkflow = "inkflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow"]
artifacts = ["src/inkflow/theme/**"]
exclude = ["src/inkflow/theme/showcase/**", "src/inkflow/theme/**/__pycache__/**"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.5",
    "lxml-stubs>=0.5",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
docs = [
    "mkdocs-material>=9.0",
]


[tool.pyright]
reportUnusedCallResult = "none"
reportMissingTypeStubs = "none"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
