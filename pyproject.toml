[project]
name = "inkflow"
version = "0.1.0.dev0"
description = "Beautiful slides from SVG. Your editor, your style."
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "lxml>=5.0",
    "markdown-it-py>=3.0",
    "rich>=15.0.0",
    "watchfiles>=0.21",
    "websockets>=12.0",
]

[project.scripts]
inkflow = "inkflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow"]
artifacts = ["src/inkflow/theme/**"]
exclude = ["src/inkflow/theme/showcase/**", "src/inkflow/theme/**/__pycache__/**"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.5",
    "lxml-stubs>=0.5",
    "poethepoet>=0.46.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.poe.tasks]
lint      = "ruff check ."
fmt       = "ruff format --check ."
typecheck = "basedpyright"
test      = "pytest"

[tool.poe.tasks.check]
sequence = ["lint", "fmt", "typecheck", "test"]

[tool.pyright]
reportUnusedCallResult = "none"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
