<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkflow="urn:inkflow" inkflow:parent="base" viewBox="0 0 1920 1080" width="1920" height="1080" version="1.1" id="svg12">
  <defs id="defs2">
    <marker id="arrow" style="overflow:visible" refX="5" refY="0" orient="auto-start-reverse" markerWidth="1" markerHeight="1" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid">
      <path transform="scale(0.7)" d="M -2,-4 9,0 -2,4 c 2,-2.33 2,-5.66 0,-8 z" style="fill:context-stroke;fill-rule:evenodd;stroke:none" id="path1"/>
    </marker>
    </defs>
  <text class="inkflow-fill-text" x="160" y="146" font-family="sans-serif" font-size="60px" font-weight="700" id="text2">Anatomy of this slide</text>
  <!-- Spine: you draw an SVG -> declare it in deck.py -> the browser renders it. -->
  <g id="box-svg" transform="translate(0,-25)">
    <rect x="160" y="340" width="440" height="150" rx="16" class="inkflow-fill-surface inkflow-stroke-border inkflow-stroke-accent inkflow-stroke-purple" stroke-width="2" id="rect2"/>
    <text x="380" y="405" text-anchor="middle" font-family="sans-serif" font-size="34px" font-weight="700" class="inkflow-fill-text" id="text3">slides/diagram.svg</text>
    <text x="380" y="448" text-anchor="middle" font-family="sans-serif" font-size="24px" class="inkflow-fill-text-muted" id="text4">you draw this</text>
  </g>
  <g id="box-deck" transform="translate(0,-25)">
    <rect x="740" y="340" width="440" height="150" rx="16" class="inkflow-fill-surface inkflow-stroke-accent inkflow-stroke-purple" stroke-width="3" id="rect4"/>
    <text x="960" y="405" text-anchor="middle" font-family="monospace" font-size="40px" class="inkflow-fill-text" id="text5">deck.py</text>
    <text x="960" y="448" text-anchor="middle" font-family="monospace" font-size="22px" class="inkflow-fill-text-muted" id="text6" style="font-size:24px"><tspan style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:24px;font-family:sans-serif;-inkscape-font-specification:sans-serif" id="tspan13">puts it all together</tspan></text>
  </g>
  <g id="box-browser" transform="translate(0,-25)">
    <rect x="1320" y="340" width="440" height="150" rx="16" class="inkflow-fill-surface inkflow-stroke-border inkflow-stroke-accent inkflow-stroke-purple" stroke-width="2" id="rect6"/>
    <text x="1540" y="405" text-anchor="middle" font-family="sans-serif" font-size="34px" font-weight="700" class="inkflow-fill-text" id="text7" style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:monospace;-inkscape-font-specification:'monospace Bold'"><tspan style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-family:monospace;-inkscape-font-specification:monospace" id="tspan12">inkflow serve</tspan></text>
    <text x="1540" y="448" text-anchor="middle" font-family="sans-serif" font-size="24px" class="inkflow-fill-text-muted" id="text8">to launch presentation</text>
    <path style="fill: none; stroke-width: 4.90314; stroke-linecap: round; stroke-miterlimit: 3; stroke-dasharray: none; stroke-opacity: 1; marker-end: url(#arrow)" d="m 1180,390 h 132.8012" id="path3" transform="translate(0,25)" class="inkflow-stroke-accent inkflow-stroke-purple"/>
  </g>
  <!-- Markdown feeds a zone in deck.py, the same zone that holds the caption below. -->
  <g id="box-md" transform="translate(0,-25)">
    <rect x="740" y="640" width="440" height="150" rx="16" class="inkflow-fill-surface inkflow-stroke-border inkflow-stroke-accent inkflow-stroke-purple" stroke-width="2" id="rect8"/>
    <text x="960" y="705" text-anchor="middle" font-family="sans-serif" font-size="30px" font-weight="700" class="inkflow-fill-text" id="text9">slides/diagram.md</text>
    <text x="960" y="748" text-anchor="middle" font-family="sans-serif" font-size="24px" class="inkflow-fill-text-muted" id="text10">fills the box below</text>
  </g>
  <rect id="zone-content" x="160.04848" y="819.44824" width="1599.9031" height="180.5033" rx="15.99903" style="fill:none;stroke:#000000;stroke-width:1.09694;stroke-opacity:1"/>
  <path style="fill: none; stroke-width: 5.05885; stroke-linecap: round; stroke-miterlimit: 3; stroke-dasharray: none; stroke-opacity: 1; marker-end: url(#arrow)" d="M 960,612.32854 V 470.958" id="path13" class="inkflow-stroke-accent inkflow-stroke-purple"/>
  <path style="fill: none; stroke-width: 4.90314; stroke-linecap: round; stroke-miterlimit: 3; stroke-dasharray: none; stroke-opacity: 1; marker-end: url(#arrow)" d="M 599.70126,390 H 732.50247" id="path2" class="inkflow-stroke-accent inkflow-stroke-purple"/>
</svg>
