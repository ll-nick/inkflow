# Publishes the slides on GitHub Pages at every push to __BRANCH__.
# Made by `inkflow setup-pages github`; run it again with --force to update it.
# Once per repository: Settings -> Pages -> Source: "GitHub Actions".

name: Publish slides

on:
  push:
    branches: [__BRANCH_JSON__]
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run supersede an in-flight one, but never cancel a
# deploy that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Videos, images and fonts kept in Git LFS, not their pointer files.
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install a PDF converter if the deck has PDF figures
        run: |
          if git ls-files -- __PDF_GLOB__ | grep -q .; then
            sudo apt-get update -q
            sudo apt-get install -y -q poppler-utils
          fi

      # Pictures and videos as files beside index.html (not inside it, as a
      # plain `inkflow build` does): on a web host the first slide shows at
      # once and each video streams when its slide needs it.
      - name: Build the slides
        run: |
          __UV_RUN__ inkflow build__DECK_OPT__ --assets-folder --output _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
