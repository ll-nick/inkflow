<!DOCTYPE html>
<html lang="en" data-theme="__DATA_THEME__">
<head>
  <meta charset="UTF-8">
  <title>__TITLE__</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; }
    .slide { position: relative; overflow: hidden; break-after: page; }
    .slide > .bleed, .slide .trim { position: absolute; overflow: hidden; }
    .slide.bled .trim { overflow: visible; }
    .slide .trim > svg { width: 100%; height: 100%; display: block; }
    .slide.bled .trim > svg { overflow: visible; }
    .slide > .marks { position: absolute; inset: 0; width: 100%; height: 100%; }
    /* biome-ignore lint/complexity/noImportantStyles: overrides animation CSS for PDF rendering */
    [data-step] { opacity: 1 !important; transform: none !important; }
    /* biome-ignore lint/complexity/noImportantStyles: overrides animation CSS for PDF rendering */
    .anim-fade-out[data-step] { opacity: 0 !important; }
    /* A page shows a video's first frame, not its player (whose 0:00 is
       drawn in the computer's own font). */
    video::-webkit-media-controls { display: none !important; }
  </style>
  <style>/* __STYLES__ */</style>
</head>
<body>
__SLIDES__
</body>
</html>
