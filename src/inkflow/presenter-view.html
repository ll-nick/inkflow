<!DOCTYPE html>
<html lang="en" data-theme="__DATA_THEME__">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inkflow · Presenter</title>
  <style>__STYLES__</style>
  <style>__CSS__</style>
</head>
<body>
  <main id="pv">
    <section id="pv-current">
      <div id="pv-current-inner"></div>
    </section>
    <aside id="pv-side">
      <section id="pv-next">
        <div class="pv-label">NEXT</div>
        <div id="pv-next-inner"></div>
      </section>
      <section id="pv-info">
        <div id="pv-clock">--:--:--</div>
        <div id="pv-elapsed">elapsed 00:00</div>
        <div id="pv-slide">Slide – / –</div>
        <div id="pv-step">Step – / –</div>
        <div id="pv-live"><span id="pv-dot"></span><span id="pv-live-label">offline</span></div>
      </section>
      <section id="pv-notes"></section>
    </aside>
  </main>
  <script>__JS__</script>
</body>
</html>
