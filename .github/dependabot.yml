version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Give updates a couple days to age past pnpm's minimumReleaseAge
    # supply-chain check (default 24h), or CI can fail on fresh transitive
    # deps pulled in by the bump.
    cooldown:
      default-days: 2
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
