name: CI

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - run: uv sync

      - run: uv run ruff format --check src/ tests/

      - run: uv run ruff check src/ tests/

      - run: uv run pytest
