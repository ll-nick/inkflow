name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - run: npm ci

      - name: JS checks
        run: |
          npx biome check src/ts/ src/css/
          npx tsc --noEmit

      - name: Check bundles are up to date
        run: |
          mise run bundle
          git diff --exit-code src/inkflow/bundles/

      - run: uv run ruff format --check src/ tests/

      - run: uv run ruff check src/ tests/

      - run: uv run basedpyright

      - run: uv run pytest

      - run: git ls-files '*.svg' | xargs --no-run-if-empty uv run inkflow clean --check

      - name: Build demo deck
        run: uv run inkflow build demo/deck.py

      - name: Build init deck
        run: |
          uv run inkflow init /tmp/test-init
          uv run inkflow build /tmp/test-init/deck.py

  export:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: Export demo deck
        run: uv run inkflow export demo/deck.py --no-sandbox
