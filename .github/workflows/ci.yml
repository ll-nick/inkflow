name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      # Deterministic install from pnpm-lock.yaml (fails on a lockfile mismatch).
      # The mise tasks below depend on `install-js`, which re-syncs with a plain
      # `pnpm install`, a no-op once this has run.
      - run: pnpm install --frozen-lockfile

      - name: Check bundles are up to date
        run: |
          mise run bundle
          git diff --exit-code src/inkflow/bundles/

      # Each check is the same mise task run locally, kept as separate steps so a
      # failure points at the exact task. Keep this list in sync with `check`'s
      # `depends` in mise.toml.
      - run: mise run lint-lock
      - run: mise run lint-py
      - run: mise run fmt-py
      - run: mise run typecheck-py
      - run: mise run lint-deps
      - run: mise run test
      - run: mise run lint-js
      - run: mise run typecheck-js
      - run: mise run test-js

      - name: Check SVGs are clean
        shell: bash
        run: |
          svgs="$(git ls-files '*.svg')"
          if [ -n "$svgs" ]; then
            echo "$svgs" | xargs uv run inkflow clean --check
          fi

      - name: Build demo deck
        run: uv run inkflow build --deck demo/deck.py

      - name: Build theme showcase deck
        run: uv run inkflow build --deck src/inkflow/theme/showcase/deck.py

      - name: Build init deck
        run: |
          uv run inkflow init /tmp/test-init
          uv run inkflow build --deck /tmp/test-init/deck.py

  export:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: Export demo deck
        run: uv run inkflow export --deck demo/deck.py --no-sandbox
