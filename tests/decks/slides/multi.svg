<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#222831"/>
  <text x="960" y="150" font-family="sans-serif" font-size="64" fill="#eeeeee" text-anchor="middle">one element, a whole lifecycle</text>

  <!-- `hero` carries four cues at four steps: enter, emphasis, exit, then re-enter. -->
  <g id="hero">
    <rect x="710" y="360" width="500" height="320" rx="24" fill="#00adb5"/>
    <text x="960" y="545" font-family="sans-serif" font-size="60" fill="#ffffff" text-anchor="middle">hero</text>
  </g>

  <text id="caption" x="960" y="840" font-family="sans-serif" font-size="40" fill="#00adb5" text-anchor="middle">enter · highlight · exit · return</text>
</svg>
