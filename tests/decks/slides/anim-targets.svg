<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#393e46"/>
  <text x="960" y="150" font-family="sans-serif" font-size="70" fill="#ffffff" text-anchor="middle">built-in animations</text>

  <!-- Each animation targets a whole group (box + label) so the label animates
       with the box. Row 1: entrances. Row 2: exits + highlight. -->
  <g id="a">
    <rect x="80" y="300" width="380" height="200" rx="16" fill="#00adb5"/>
    <text x="270" y="415" font-family="sans-serif" font-size="42" fill="#ffffff" text-anchor="middle">FadeIn</text>
  </g>
  <g id="b">
    <rect x="540" y="300" width="380" height="200" rx="16" fill="#00adb5"/>
    <text x="730" y="415" font-family="sans-serif" font-size="42" fill="#ffffff" text-anchor="middle">FadeOut</text>
  </g>
  <g id="c">
    <rect x="1000" y="300" width="380" height="200" rx="16" fill="#00adb5"/>
    <text x="1190" y="415" font-family="sans-serif" font-size="42" fill="#ffffff" text-anchor="middle">Bounce</text>
  </g>
  <g id="d">
    <rect x="1460" y="300" width="380" height="200" rx="16" fill="#00adb5"/>
    <text x="1650" y="415" font-family="sans-serif" font-size="42" fill="#ffffff" text-anchor="middle">SlideIn</text>
  </g>

  <g id="e">
    <rect x="80" y="580" width="380" height="200" rx="16" fill="#eeeeee"/>
    <text x="270" y="695" font-family="sans-serif" font-size="42" fill="#222831" text-anchor="middle">SlideOut</text>
  </g>
  <g id="f">
    <rect x="540" y="580" width="380" height="200" rx="16" fill="#eeeeee"/>
    <text x="730" y="695" font-family="sans-serif" font-size="42" fill="#222831" text-anchor="middle">ZoomIn</text>
  </g>
  <g id="g">
    <rect x="1000" y="580" width="380" height="200" rx="16" fill="#eeeeee"/>
    <text x="1190" y="695" font-family="sans-serif" font-size="42" fill="#222831" text-anchor="middle">ZoomOut</text>
  </g>
  <g id="h">
    <rect x="1460" y="580" width="380" height="200" rx="16" fill="#eeeeee"/>
    <text x="1650" y="695" font-family="sans-serif" font-size="42" fill="#222831" text-anchor="middle">Highlight</text>
  </g>
</svg>
