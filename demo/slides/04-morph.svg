<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkflow="urn:inkflow" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" viewBox="0 0 1920 1080" width="1920" height="1080" inkflow:parent="local:main.svg"><g inkscape:groupmode="layer" inkscape:label="__inkflow:layout:main__" sodipodi:insensitive="true" inkflow:layout-src="local:main.svg" inkflow:layout-hash="92687e1c"><!-- Catppuccin Mocha background -->
  <rect width="1920" height="1080" class="inkflow-fill-bg"/>
  <!-- Footer bar -->
  <rect y="1040" width="1920" height="40" class="inkflow-fill-surface"/>
  <!-- Accent line above footer -->
  <rect y="1036" width="1920" height="4" class="inkflow-fill-accent inkflow-fill-purple"/>
  <!-- Slide number -->
  <text id="zone-slide-number" x="1840" y="1066" font-family="sans-serif" font-size="20" text-anchor="end" class="inkflow-fill-grey">99</text>
  <text x="1852" y="1066" font-family="sans-serif" font-size="20" class="inkflow-fill-grey">/</text>
  <text id="zone-slide-total" x="1864" y="1066" font-family="sans-serif" font-size="20" text-anchor="start" class="inkflow-fill-grey">99</text>
</g><text x="960" y="96" text-anchor="middle" font-family="sans-serif" font-size="44" class="inkflow-fill-text inkflow-fill-code-text">One morph, every transform</text>
  <!-- hero box: moves, resizes non-uniformly, recolours — corners stay round -->
  <rect id="box" x="1160" y="170" width="620" height="230" rx="28" class="inkflow-fill-yellow"/>
  <!-- group with two text lines: nested transform, text stays crisp -->
  <g id="grp" transform="translate(1120, 650)">
    <rect width="660" height="180" rx="18" class="inkflow-fill-accent inkflow-fill-purple"/>
    <text x="330" y="88" text-anchor="middle" font-family="monospace" font-size="44" class="inkflow-fill-bg">grouped</text>
    <text x="330" y="138" text-anchor="middle" font-family="monospace" font-size="30" class="inkflow-fill-bg">font grows</text>
  </g>
  <!-- free circle: uniform scale, move, recolour -->
  <circle id="dot" cx="330" cy="820" r="165" class="inkflow-fill-red"/>
  <!-- rotation -->
  <rect id="bar" x="660" y="250" width="320" height="120" rx="14" transform="rotate(26, 820, 310)" class="inkflow-fill-orange"/>
  <!-- line: endpoints slide, stroke stays even -->
  <line id="line" x1="640" y1="520" x2="1080" y2="920" stroke-width="10" class="inkflow-stroke-red"/>
  <!-- unmatched content fades in -->
  <rect id="enter-only" x="120" y="470" width="300" height="92" rx="12" class="inkflow-fill-teal"/>
  <text x="270" y="526" text-anchor="middle" font-family="monospace" font-size="26" class="inkflow-fill-bg">enters</text>
</svg>
