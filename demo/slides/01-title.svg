    <text id="tagline" x="960.22461" y="660" text-anchor="middle" font-family="sans-serif" font-size="46px" class="inkflow-fill-accent"><tspan id="tspan6" x="960.22461" y="660">Beautiful slides from SVG.</tspan><tspan id="tspan7" x="960.22461" y="717.5">Your editor, your style.</tspan></text>
