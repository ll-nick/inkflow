  <!-- Hand-drawn title slide. Parents builtin:base directly — no slide number, no footer.
       .inkflow-demo-logo-mark and .inkflow-demo-logo-flow are defined in demo/styles.css
       and switch colour when the user presses `t` to toggle dark/light. -->
  <!-- Full landscape logo centred on the upper half.
       Nested SVG owns the logo's coordinate system (viewBox 0 0 340 114.34567);
       the outer x/y/width/height position and scale it on the 1920×1080 canvas. -->
  <g id="g4" transform="translate(-460.49411,-237.92163)">
