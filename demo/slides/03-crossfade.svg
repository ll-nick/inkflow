.inkflow-stroke-code-text { stroke: #cdd6f4; }
.inkflow-fill-red { fill: #f38ba8; }
.inkflow-stroke-red { stroke: #f38ba8; }
.inkflow-fill-orange { fill: #fab387; }
.inkflow-stroke-orange { stroke: #fab387; }
.inkflow-fill-yellow { fill: #f9e2af; }
.inkflow-stroke-yellow { stroke: #f9e2af; }
.inkflow-fill-green { fill: #a6e3a1; }
.inkflow-stroke-green { stroke: #a6e3a1; }
.inkflow-fill-teal { fill: #94e2d5; }
.inkflow-stroke-teal { stroke: #94e2d5; }
.inkflow-fill-blue { fill: #89b4fa; }
.inkflow-stroke-blue { stroke: #89b4fa; }
.inkflow-fill-purple { fill: #cba6f7; }
.inkflow-stroke-purple { stroke: #cba6f7; }
.inkflow-fill-pink { fill: #f5c2e7; }
.inkflow-stroke-pink { stroke: #f5c2e7; }
.inkflow-fill-grey { fill: #6c7086; }
.inkflow-stroke-grey { stroke: #6c7086; }</style></defs><text x="960" y="96" text-anchor="middle" font-family="sans-serif" font-size="44" class="inkflow-fill-text inkflow-fill-code-text">One morph, every transform</text>
  <!-- hero box: moves, resizes non-uniformly, recolours — corners stay round -->
  <rect id="box" x="140" y="220" width="380" height="430" rx="28" class="inkflow-fill-blue"/>
  <!-- group with two text lines: nested transform, text stays crisp -->
  <g id="grp" transform="translate(720, 240)">
    <rect width="440" height="250" rx="18" class="inkflow-fill-accent inkflow-fill-purple"/>
    <text x="220" y="120" text-anchor="middle" font-family="monospace" font-size="24" class="inkflow-fill-bg">grouped</text>
    <text x="220" y="152" text-anchor="middle" font-family="monospace" font-size="18" class="inkflow-fill-bg">font grows</text>
  </g>
  <!-- free circle: uniform scale, move, recolour -->
  <circle id="dot" cx="1700" cy="300" r="110" class="inkflow-fill-green"/>
  <!-- rotation -->
  <rect id="bar" x="1320" y="560" width="320" height="120" rx="14" transform="rotate(-18, 1480, 620)" class="inkflow-fill-orange"/>
  <!-- line: endpoints slide, stroke stays even -->
  <line id="line" x1="180" y1="760" x2="780" y2="760" stroke-width="10" class="inkflow-stroke-red"/>
  <!-- unmatched content fades out -->
  <rect id="exit-only" x="840" y="800" width="300" height="92" rx="12" class="inkflow-fill-pink"/>
  <text x="990" y="856" text-anchor="middle" font-family="monospace" font-size="26" class="inkflow-fill-bg">exits</text>
</svg>
