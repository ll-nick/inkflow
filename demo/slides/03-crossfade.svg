.inkflow-stroke-text { stroke: #cdd6f4; }
.inkflow-fill-text-muted { fill: #a6adc8; }
.inkflow-stroke-text-muted { stroke: #a6adc8; }
.inkflow-fill-accent { fill: #cba6f7; }
.inkflow-stroke-accent { stroke: #cba6f7; }
.inkflow-fill-accent-fg { fill: #11111b; }
.inkflow-stroke-accent-fg { stroke: #11111b; }
