<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkflow="urn:inkflow" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" viewBox="0 0 1920 1080" width="1920" height="1080" inkflow:parent="local:main.svg"><g inkscape:groupmode="layer" inkscape:label="__inkflow:layout:main__" sodipodi:insensitive="true" inkflow:layout-src="local:main.svg" inkflow:layout-hash="d78aa2ad"><defs/><!-- Catppuccin Mocha background -->
  <rect width="1920" height="1080" class="inkflow-fill-bg"/>
  <!-- Footer bar -->
  <rect y="1040" width="1920" height="40" class="inkflow-fill-surface"/>
  <!-- Accent line above footer -->
  <rect y="1036" width="1920" height="4" class="inkflow-fill-accent inkflow-fill-purple"/>
  <!-- Slide number -->
  <text id="zone-slide-number" x="1840" y="1066" font-family="sans-serif" font-size="20" text-anchor="end" class="inkflow-fill-grey">99</text>
  <text x="1852" y="1066" font-family="sans-serif" font-size="20" class="inkflow-fill-grey">/</text>
  <text id="zone-slide-total" x="1864" y="1066" font-family="sans-serif" font-size="20" text-anchor="start" class="inkflow-fill-grey">99</text>
</g><defs><style id="inkflow-preview">.inkflow-fill-bg { fill: #1e1e2e; }
.inkflow-stroke-bg { stroke: #1e1e2e; }
.inkflow-fill-surface { fill: #313244; }
.inkflow-stroke-surface { stroke: #313244; }
